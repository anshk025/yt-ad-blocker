<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>YouTube Ad Blocker</h1>
    <div class="status">
      <span id="statusText">Active</span>
      <span class="status-indicator" id="statusIndicator"></span>
    </div>
    
    <div class="stats">
      <p>Ads blocked: <span id="adsBlocked">0</span></p>
      <p>Time saved: <span id="timeSaved">0</span> minutes</p>
      <p>Session blocks: <span id="sessionBlocks">0</span></p>
    </div>
    
    <div class="controls">
      <label class="switch">
        <input type="checkbox" id="toggleSwitch" checked>
        <span class="slider round"></span>
      </label>
      <span class="switch-label">Enable Ad Blocking</span>
    </div>
    
    <div class="info">
      <p>Refresh YouTube pages for changes to take effect</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
